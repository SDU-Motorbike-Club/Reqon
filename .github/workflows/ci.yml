# Three independent boundaries, three jobs, and ONE gate.
#
#   frontend  the React/TS toolchain or the client tests failed
#   database  the schema, a migration, RLS, or an RPC failed
#   e2e       a real browser, driving the real app against a real (local) database, hit a behavior the unit/DB
#             layers alone cannot see
#   gate      green only when all three are green. This is the ONE check that branch protection requires and the
#             ONE thing deploy.yml waits for, so a new job added above is covered by adding it to `needs` below.
#
# No job waits on another, so one run shows every problem at once.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  # Nightly on main: catches drift nobody pushed (an expired token, a changed base image, a new advisory) and
  # tells a flaky runner from a real regression, because nothing in the repo changed between two red runs.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

# A newer push to a PULL REQUEST replaces its older run. A run on main is never cancelled: a cancelled run is
# neither green nor red, and "no verdict" on a commit that is already deployed is the worst answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend (lint, types, tests, coverage, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # .nvmrc is the single source of the Node version; .npmrc's
      # engine-strict makes `npm ci` refuse anything package.json's engines
      # does not allow.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (clean, from the lockfile)
        run: npm ci

      - name: Dependency tree is valid
        run: npm ls --depth=0

      - name: Known vulnerabilities (high or worse)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The full Vitest suite, once, with the coverage floors in
      # vite.config.ts enforced. `npm test` would run the same tests again
      # without coverage, so it is not repeated here.
      - name: Tests with coverage gate
        run: npm run test:coverage

      # Includes scripts/check-bundle-budget.mjs, which fails the build if the
      # largest JS chunk regresses toward the pre-route-splitting bundle.
      - name: Production build + bundle budget
        run: npm run build

      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  database:
    name: database (migrations, RLS, RPCs, integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Needs only Docker (preinstalled on ubuntu-latest) and bash: a
      # disposable postgres:17 container, scripts/local_auth_shim.sql, every
      # migration in order, a real two-process race on promote_proposal(),
      # then every supabase/tests/*.sql file. No Supabase CLI, global or
      # otherwise, and no hosted project or credentials are involved.
      - name: Clean database, migrations, SQL tests
        run: bash scripts/verify_db.sh

  e2e:
    name: e2e (real browser, local Supabase, Phase 13 smoke suite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (clean, from the lockfile)
        run: npm ci

      # Points `npm run dev` (which playwright.config.ts's webServer starts)
      # at the local Supabase stack this job starts below. These are the
      # fixed, non-secret demo keys `supabase start` always generates locally
      # — never the hosted project, never a real credential.
      - name: Point the app at the local Supabase stack
        run: |
          cat > .env.development.local <<'EOF'
          VITE_SUPABASE_URL=http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY=sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          EOF

      # Applies every migration in supabase/migrations, in order, to a local
      # stack (Docker, preinstalled on ubuntu-latest) — the same one
      # tests/e2e/setup/*.ts talk to directly for fixtures and cleanup.
      #
      # Only what the suite uses is started (database, auth, REST, realtime, storage, the gateway and the
      # Edge Functions runtime). Studio, the image proxy, the log stack, mail catcher and pooler are about half
      # of the image pulls, and the pulls are what the registry's "Data limit exceeded" rate limit counts.
      # A pull that is refused is retried after a pause instead of failing a run that has nothing wrong with it.
      - name: Start the local Supabase stack
        run: |
          for attempt in 1 2 3; do
            if npx supabase start -x studio,imgproxy,logflare,vector,mailpit,supavisor,postgres-meta; then exit 0; fi
            echo "supabase start failed (attempt $attempt of 3)"
            npx supabase stop --no-backup || true
            sleep $((attempt * 45))
          done
          exit 1

      # The Requirements Book: imports static/book/MS2627_MotoStudent.pdf into
      # the local private bucket and records the verified clause pages
      # (scripts/book/sync-local.mjs; `npm run dev` would also run it via
      # `predev`, but a failure here names the Book instead of the web server).
      - name: Set up the local Requirements Book
        run: npm run book:sync:local

      # Task attachments (docs/ultraplan Phase 3): the Edge Functions, served against the stack's own S3
      # endpoint with its fixed local demo keys — tests/e2e/attachments-flow.spec.ts uploads through them.
      - name: Serve the attachment Edge Functions
        run: |
          node scripts/attachments/functions-env-local.mjs
          nohup npx supabase functions serve --env-file supabase/functions/.env.local > functions-serve.log 2>&1 &
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/attachment-upload-url || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          cat functions-serve.log
          exit 1

      - name: Install Playwright's Chromium, with OS dependencies
        run: npx playwright install --with-deps chromium

      # Both viewport projects (desktop and a 375px phone width) — the phone
      # project is real regression coverage for a Phase 13 finding (a fixed
      # bottom onboarding banner intercepting clicks on short screens), not
      # exploratory-only. Fixtures are created and torn down by
      # tests/e2e/setup/global-{setup,teardown}.ts around the whole run.
      # playwright.config.ts retries a failed test once on CI: a test that fails twice is a real failure, one
      # that passes the second time is reported as "flaky" in the log so it is seen and fixed, not hidden.
      - name: Real-browser E2E smoke suite
        run: npm run test:e2e
        env:
          PLAYWRIGHT_SUPABASE_URL: http://127.0.0.1:54321
          PLAYWRIGHT_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

      # Phase 4: dump → encrypt → verify → R2/GitHub/Drive stand-ins → status record → purge, against this same
      # local stack with throw-away keys (ops/backup/test/local-cycle.sh; nothing real is touched).
      - name: Backup chain (local stack, throw-away keys)
        run: |
          sudo apt-get install -y -qq age rclone
          npm run backup:test:local

      - name: Show the Edge Function log and containers on failure
        if: failure()
        run: |
          cat functions-serve.log 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' || true

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The single required check. `if: always()` makes it run even when a job above failed or was skipped, and
  # the script makes it red unless every one of them succeeded: a skipped or cancelled job must NOT read as
  # green, which is the default for a job that merely `needs` another.
  gate:
    name: gate (all checks green)
    needs: [frontend, database, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job finished as '$r', not 'success'."
              exit 1
            fi
          done
